[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tandem-repeat-calling-pipeline"
version = "0.1.0"
description = "Reproducible scaffold for tandem-repeat caller orchestration"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
tr-pipeline = "tr_calling_pipeline.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
