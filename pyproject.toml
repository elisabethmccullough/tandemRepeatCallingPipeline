[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tandem-repeat-calling-pipeline"
version = "0.1.0"
description = "Reproducible scaffold for tandem-repeat caller orchestration"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]
license = {file = "LICENSE"}
readme = "README.md"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["pytest>=7.4,<9", "build>=1,<2", "ruff>=0.5,<1"]

[project.scripts]
tr-pipeline = "tr_calling_pipeline.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tr_calling_pipeline = ["schemas/*.schema.json"]

[tool.ruff]
target-version = "py311"
line-length = 140

[tool.ruff.lint]
select = ["E9", "F"]
