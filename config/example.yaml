schema_version: "1.0"
run:
  case_id: CASE001
  subject_id: SUBJECT001
  sample_id: HG00438
  locus_id: HTT
  output_root: ../outputs
  overwrite: false
inputs:
  assembly_fasta: ../data/assembly.fasta
  assembly_records:
    - {record_id: HAP1, sequence_id: patient-hap1, display_label: Patient HAP1, sequence_role: PATIENT_HAPLOTYPE}
    - {record_id: HAP2, sequence_id: patient-hap2, display_label: Patient HAP2, sequence_role: PATIENT_HAPLOTYPE}
  mini_bam: ../data/sample.mini.bam
  mini_bam_index: ../data/sample.mini.bam.bai
  reference_fasta: ../references/hg38.fasta
  reference_fasta_index: ../references/hg38.fasta.fai
locus_config: loci/htt_hg38.yaml
case_package:
  enabled: true
  package_root: ../case-packages
  comparison_panel: {panel_id: UMN_HTT_CLINICAL_COMPARATORS, panel_version: development, required: false}
execution: {threads: 4, dry_run: false}

tools:
  samtools: {executable: samtools, required: true, execution_mode: NATIVE}
  minimap2: {executable: minimap2, required: true, execution_mode: NATIVE}
  # Development-only: keep false until the laboratory VAMOS syntax is verified.
  vamos: {executable: vamos, required: false, execution_mode: NATIVE, allow_provisional_adapter: false, additional_arguments: []}
  straglr: {executable: straglr.py, required: false, execution_mode: NATIVE}
  lastdb: {executable: lastdb, required: false, execution_mode: NATIVE}
  lastal: {executable: lastal, required: false, execution_mode: NATIVE}
  tandem_genotypes: {executable: tandem-genotypes, required: false, execution_mode: NATIVE}
container:
  apptainer: {executable: apptainer}
  image: null
  binds: []
