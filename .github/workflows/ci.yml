name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python }}'}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: tr-pipeline validate-schemas
      - run: python -m compileall -q src tests scripts
      - run: python scripts/safety_scan.py
      - run: python -m pytest tests/test_runner_options.py -q
      - uses: actions/upload-artifact@v4
        if: failure()
        with: {name: failure-${{ matrix.os }}-${{ matrix.python }}, path: outputs}

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install build
      - run: python -m build
      - run: python -m venv wheel-env
      - run: wheel-env/bin/pip install dist/*.whl
      - run: cd /tmp && "$GITHUB_WORKSPACE/wheel-env/bin/tr-pipeline" --help
      - run: cd /tmp && "$GITHUB_WORKSPACE/wheel-env/bin/tr-pipeline" validate-schemas
      - run: cd /tmp && "$GITHUB_WORKSPACE/wheel-env/bin/tr-pipeline" demo --output "demo output"
      - run: cd /tmp && "$GITHUB_WORKSPACE/wheel-env/bin/tr-pipeline" validate-case-package --package "demo output/portable synthetic case package"
      - run: python scripts/check_release_readiness.py
